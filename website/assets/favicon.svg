<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 16.25 62 62" width="512" height="512">
  <!-- Bridge's knot, flat: three Borromean rings in the colours of the icon's three lights.
       Each ring is masked by the band of the ring that passes over it (A over B, B over C, C over A). -->
  <defs>
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="34" y1="23" x2="66" y2="55"><stop offset="0" stop-color="#4cf0b4"/><stop offset="1" stop-color="#11a678"/></linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="24.5" y1="39.5" x2="56.5" y2="71.5"><stop offset="0" stop-color="#9c8cff"/><stop offset="1" stop-color="#5440e0"/></linearGradient>
    <linearGradient id="gC" gradientUnits="userSpaceOnUse" x1="43.5" y1="39.5" x2="75.5" y2="71.5"><stop offset="0" stop-color="#ffb070"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
    <mask id="underC" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="59.5" cy="55.5" r="16" fill="none" stroke="#000" stroke-width="13.1"/></mask>
    <mask id="underA" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="39" r="16" fill="none" stroke="#000" stroke-width="13.1"/></mask>
    <mask id="underB" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="40.5" cy="55.5" r="16" fill="none" stroke="#000" stroke-width="13.1"/></mask>
  </defs>
  <circle cx="50" cy="39" r="16" fill="none" stroke="url(#gA)" stroke-width="7.5" mask="url(#underC)"/>
  <circle cx="40.5" cy="55.5" r="16" fill="none" stroke="url(#gB)" stroke-width="7.5" mask="url(#underA)"/>
  <circle cx="59.5" cy="55.5" r="16" fill="none" stroke="url(#gC)" stroke-width="7.5" mask="url(#underB)"/>
</svg>
