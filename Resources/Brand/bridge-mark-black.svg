<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 16.25 62 62" width="512" height="512">
  <!-- Bridge's knot in one colour, for documents, the license and anywhere colour isn't available.
       Each ring is masked by the band of the ring that passes over it (A over B, B over C, C over A). -->
  <defs>
    <mask id="underC" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="59.5" cy="55.5" r="16" fill="none" stroke="#000" stroke-width="13.1"/></mask>
    <mask id="underA" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="39" r="16" fill="none" stroke="#000" stroke-width="13.1"/></mask>
    <mask id="underB" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="40.5" cy="55.5" r="16" fill="none" stroke="#000" stroke-width="13.1"/></mask>
  </defs>
  <g fill="none" stroke="#111114" stroke-width="7.5">
    <circle cx="50" cy="39" r="16" mask="url(#underC)"/>
    <circle cx="40.5" cy="55.5" r="16" mask="url(#underA)"/>
    <circle cx="59.5" cy="55.5" r="16" mask="url(#underB)"/>
  </g>
</svg>
